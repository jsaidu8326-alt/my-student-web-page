
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Student Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header class="site-header">
    <div class="container nav-container">
        <a class="logo" href="index.html">MyPortfolio</a>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About Me</a>
            <a href="projects.html">Projects</a>
            <a href="planner.html">Academic Planner</a>
            <a class="active" href="contact.html">Contact</a>
        </nav>
    </div>
</header>

<main>
    <section class="page-banner">
        <h1>Contact Me</h1>
        <p>Have a question or want to get in touch?</p>
    </section>

    <section class="section container">
        <div class="form-card">
            <h2>Send Me a Message</h2>
            <p>Please complete all fields below.</p>

            <form id="contact-form" novalidate>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number (digits only)</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        inputmode="numeric"
                        autocomplete="tel"
                        placeholder="e.g. 08012345678"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        required
                    ></textarea>
                </div>

                <button class="btn" type="submit">Validate Message</button>

                <p id="contact-feedback"
                   class="message"
                   role="status"
                   aria-live="polite"></p>
            </form>
        </div>
    </section>
</main>

<footer class="site-footer">
    <p>&copy; 2026 JIBRIL SAIDU | Student Portfolio Project</p>
</footer>

</body>
</html>
